name: Artifact integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-presets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode and validate preset archive
        shell: python
        run: |
          from pathlib import Path
          import base64, io, zipfile

          encoded = Path("presets.zip.b64").read_text(encoding="utf-8")
          raw = base64.b64decode(encoded)
          with zipfile.ZipFile(io.BytesIO(raw)) as zf:
              bad = zf.testzip()
              assert bad is None, f"corrupt member: {bad}"
              fxps = [n for n in zf.namelist() if n.lower().endswith(".fxp")]
              assert len(fxps) == 10, f"expected 10 FXP presets, found {len(fxps)}"
              for name in fxps:
                  data = zf.read(name)
                  assert len(data) > 128, f"{name}: suspiciously small"
                  assert data[:4] == b"CcnK", f"{name}: missing VST CcnK header"
                  print("valid FXP header:", name)

      - name: Syntax-check decoder
        run: python -m py_compile decode_presets.py

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- '*.md' '*.py'; then
            exit 1
          fi
